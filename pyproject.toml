[project]
name = "tibyan-lab"
version = "0.1.0"
description = "The API behind the lab demos on tibyan.tech: forecast check, and document extraction."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120",
  "uvicorn>=0.38",
  "python-multipart>=0.0.20",
  "numpy>=2.1",
  "pandas>=2.3",
  "lightgbm>=4.6",
]

[dependency-groups]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tibyan_lab"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
